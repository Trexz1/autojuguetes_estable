{% extends "base.html" %}{% block title %}Nueva entrada | Panel{% endblock %}{% block content %}
<h1>Nueva entrada multiproducto</h1>{% if error %}<div class="alerta alerta-error">{{ error }}</div>{% endif %}
<form method="post" class="form-card" id="entrada-form"><label>Proveedor</label><select name="id_proveedor"><option value="">Sin proveedor</option>{% for p in proveedores %}{% if p.activo %}<option value="{{ p.id_proveedor }}">{{ p.nombre }}{% if p.empresa %} - {{ p.empresa }}{% endif %}</option>{% endif %}{% endfor %}</select>
<div class="entrada-builder"><h2>Productos de entrada</h2><div class="entrada-row"><select id="entrada-producto"><option value="">Selecciona producto</option>{% for j in juguetes %}<option value="{{ j.id_juguete }}" data-nombre="{{ j.nombre }}" data-precio-venta="{{ j.precio or 0 }}">{{ j.nombre }} | venta: ${{ "%.2f"|format(j.precio or 0) }} | stock: {{ j.stock }}</option>{% endfor %}</select><input id="entrada-cantidad" type="number" min="1" placeholder="Cantidad"><input id="entrada-costo" type="number" min="0" step="0.01" placeholder="Precio de compra unitario"><button type="button" class="btn" id="btn-agregar-entrada">Agregar</button></div>
<table id="tabla-entrada-items"><thead><tr><th>Producto</th><th>Cantidad</th><th>Compra unit.</th><th>Subtotal</th><th></th></tr></thead><tbody></tbody></table><strong>Total costo: $<span id="entrada-total">0.00</span></strong></div><input type="hidden" name="items_json" id="items-json" value="[]"><label>Observaciones</label><textarea name="observaciones"></textarea><div class="acciones"><button class="btn" type="submit">Guardar entrada y sumar stock</button><a class="btn btn-secondary" href="/panel/entradas">Cancelar</a></div></form>{% endblock %}
